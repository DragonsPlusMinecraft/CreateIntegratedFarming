plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id "me.modmuss50.mod-publish-plugin" version "2.0.0-beta.2"
    id "com.diffplug.spotless" version "7.0.2"
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def allIntegrationSourceSets = [
        "farmersdelight",
        "netherdepthsupgrade",
        "mynethersdelight",
        "corndelight",
        "createenchantablemachinery",
        "crabberdelight",
        "untitledduck",
        "delightoflight",
        "sable",
        "twilightdelight",
]

def integrationSourceSetDependencies = [
        mynethersdelight: ["farmersdelight"],
        corndelight    : ["farmersdelight"],
        crabberdelight : ["farmersdelight"],
        delightoflight : ["farmersdelight"],
        twilightdelight: ["farmersdelight"],
]

def isIntegrationEnabled = { name ->
    providers.gradleProperty("enable_${name}_integration")
            .map { it.toBoolean() }
            .orElse(true)
            .get()
}

def enabledIntegrationSourceSets = allIntegrationSourceSets.findAll { name ->
    isIntegrationEnabled(name)
}

def hasIntegration = { name ->
    enabledIntegrationSourceSets.contains(name)
}

integrationSourceSetDependencies.each { name, dependencies ->
    if (hasIntegration(name)) {
        def missingDependencies = dependencies.findAll { dependencyName -> !hasIntegration(dependencyName) }
        if (!missingDependencies.empty) {
            throw new GradleException("The ${name} integration requires the following integration source sets: ${missingDependencies.join(', ')}")
        }
    }
}

sourceSets {
    enabledIntegrationSourceSets.each { name ->
        create(name) {
            java {
                srcDir "src/integration/${name}/java"
            }
            resources {
                srcDir "src/integration/${name}/resources"
            }
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            integrationSourceSetDependencies.get(name, []).each { dependencyName ->
                compileClasspath += sourceSets[dependencyName].output + sourceSets[dependencyName].compileClasspath
            }
        }
    }
    main {
        enabledIntegrationSourceSets.each { name ->
            runtimeClasspath += sourceSets[name].output
        }
    }
}

tasks.named("classes") {
    enabledIntegrationSourceSets.each { name ->
        finalizedBy(tasks.named("${name}Classes"))
    }
}

tasks.named("jar", Jar) {
    enabledIntegrationSourceSets.each { name ->
        from sourceSets[name].output
    }
}

tasks.named("sourcesJar", Jar) {
    enabledIntegrationSourceSets.each { name ->
        from sourceSets[name].allJava
    }
}

def integrationMixinConfigs = [
        createenchantablemachinery: "${mod_id}.createenchantablemachinery.mixins.json",
        farmersdelight           : "${mod_id}.farmersdelight.mixins.json",
        netherdepthsupgrade       : "${mod_id}.netherdepthsupgrade.mixins.json",
        delightoflight            : "${mod_id}.delightoflight.mixins.json",
        sable                     : "${mod_id}.sable.mixins.json",
]

def integrationMixinBlocks = integrationMixinConfigs
        .findAll { name, config -> hasIntegration(name) }
        .collect { name, config ->
            "[[mixins]]\n    config=\"${config}\""
        }
        .join("\n\n")

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            def dataArgs = [
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', file('src/main/translations/').getAbsolutePath(),
                    "--existing-mod", "create",
                    "--existing-mod", "create_dragons_plus",
                    "--existing-mod", "farmersdelight",
                    "--existing-mod", "netherdepthsupgrade"
            ]
            enabledIntegrationSourceSets.each { name ->
                dataArgs.addAll('--existing', file("src/integration/${name}/resources/").getAbsolutePath())
            }
            programArguments.addAll dataArgs
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            enabledIntegrationSourceSets.each { name ->
                sourceSet(sourceSets[name])
            }
        }
    }
}

configurations {
    localImplementation
    compileClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localRuntime
}

enabledIntegrationSourceSets.each { name ->
    def localConfig = configurations.create("${name}LocalImplementation") {
        canBeConsumed = false
        canBeResolved = false
    }

    configurations.named("${name}CompileClasspath") {
        extendsFrom localConfig
    }

    configurations.named("${name}RuntimeClasspath") {
        extendsFrom localConfig
    }

    configurations.named("runtimeClasspath") {
        extendsFrom localConfig
    }
}

repositories {
    maven { url "https://maven.dragons.plus/releases" } // Ponder, Flywheel
    maven { url "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url "https://mvn.devos.one/snapshots" } // Registrate
    maven { url "https://maven.blamejared.com" } // JEI
    maven { url "https://maven.theillusivec4.top/" } // Curios API
    maven { url "https://www.cursemaven.com" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // NeoForge config api port, needed by ponder
    maven { url 'https://maven.fallenbreath.me/releases' } // Conditional Mixin
    maven { url "https://maven.ryanhcode.dev/releases" } // RyanHCode Maven - Sable
}

dependencies {
    compileOnly("me.fallenbreath:conditional-mixin-neoforge:${conditional_mixin_version}")
    implementation("plus.dragons.createdragonsplus:create-dragons-plus-${minecraft_version}:${create_dragons_plus_version}")

    compileOnly("mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}")
    localRuntime("mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}")

    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${curios_minecraft_version}:api")
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}+${curios_minecraft_version}")

    if (hasIntegration("farmersdelight")) {
        farmersdelightLocalImplementation("maven.modrinth:farmers-delight:${farmers_delight_version}")
    }

    if (hasIntegration("mynethersdelight")) {
        mynethersdelightLocalImplementation("maven.modrinth:my-nethers-delight:${my_nethers_delight_version}")
    }

    if (hasIntegration("crabberdelight")) {
        crabberdelightLocalImplementation("maven.modrinth:crabbers-delight:${crabbers_delight_version}")
    }

    if (hasIntegration("corndelight")) {
        corndelightLocalImplementation("maven.modrinth:mmlib:${mmlib_version}")
        localRuntime("maven.modrinth:corn-delight:${corn_delight_version}")
    }

    if (hasIntegration("createenchantablemachinery")) {
        compileOnly("maven.modrinth:create-enchantable-machinery:${create_enchantable_machinery_version}")
    }

    if (hasIntegration("untitledduck")) {
        untitledduckLocalImplementation("maven.modrinth:geckolib:${geckolib_version}")
        untitledduckLocalImplementation("maven.modrinth:untitled-duck-mod:${untitled_duck_version}")
    }

    if (hasIntegration("netherdepthsupgrade")) {
        netherdepthsupgradeLocalImplementation("maven.modrinth:geckolib:${geckolib_version}")
        netherdepthsupgradeLocalImplementation("maven.modrinth:nether-depths-upgrade:${nether_depths_upgrade_version}")
    }

    if (hasIntegration("delightoflight")) {
        delightoflightLocalImplementation("curse.maven:delighto-flight-1347014:${delighto_flight_version}")
    }

    if (hasIntegration("sable")) {
        sableLocalImplementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
        sableLocalImplementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${create_aeronautics_version}")  { transitive false }
        sableLocalImplementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${create_aeronautics_version}")  { transitive false }
        sableLocalImplementation("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${create_aeronautics_version}")  { transitive false }
    }

    if (hasIntegration("twilightdelight")) {
        twilightdelightLocalImplementation("curse.maven:the-twilight-forest-227639:${twilight_forest_version}")
        twilightdelightLocalImplementation("maven.modrinth:twilight-delight:${twilight_delight_version}")
        localRuntime("maven.modrinth:cuisine-delight:gdWm3nOx") // java.lang.NoClassDefFoundError: dev/xkmc/cuisinedelight/content/logic/IngredientConfig TODO wait for fix
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version                   : minecraft_version,
            minecraft_version_range             : minecraft_version_range,
            neo_version                         : neo_version,
            neo_version_range                   : neo_version_range,
            loader_version_range                : loader_version_range,
            mod_id                              : mod_id,
            mod_name                            : mod_name,
            mod_license                         : mod_license,
            mod_version                         : mod_version,
            mod_authors                         : mod_authors,
            mod_description                     : mod_description,
            mod_github                          : mod_github,
            mod_logo                            : mod_logo,
            create_version_range                : create_version_range,
            create_dragons_plus_version_range   : create_dragons_plus_version_range,
            farmers_delight_version_range       : farmers_delight_version_range,
            integration_mixin_blocks            : integrationMixinBlocks
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generateModMetadata
}
neoForge.ideSyncTask generateModMetadata

tasks.withType(Jar) {
    from "LICENSE.txt"
    exclude ".cache"
}

spotless {
    java {
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile "codeformat/formatter-config.xml"
        licenseHeaderFile "codeformat/HEADER.txt"
    }
}

build.dependsOn(spotlessApply)

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_artifact_id + "-" + minecraft_version
            from components.java
        }
    }
    repositories {
        maven {
            name "DragonsPlus"
            url "https://maven.dragons.plus/releases"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from sourcesJar.archiveFile
    changelog = project.file("CHANGELOG.md").text
    version = mod_version
    type = STABLE
    displayName = "Create: Integrated Farming ${mod_version} for Create ${minecraft_version}-${create_version_production}"
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1249131"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("create")
        requires("create-dragons-plus")
        client = true
        server = true
    }

    modrinth {
        projectId = "9k1pAsfR"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("create")
        requires("create-dragons-plus")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
